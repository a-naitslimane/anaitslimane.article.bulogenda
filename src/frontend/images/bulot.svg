<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Dégradé anime vibrant pour la coquille -->
    <linearGradient id="shellGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffcc80" />
      <stop offset="50%" stop-color="#ffa726" />
      <stop offset="100%" stop-color="#f57c00" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe0b2" />
      <stop offset="100%" stop-color="#ffb74d" />
    </linearGradient>
  </defs>

  <!-- Le corps mou (pied du bulot) -->
  <path d="M 32 95 C 20 115, 110 125, 98 95 C 80 100, 45 100, 32 95 Z" fill="url(#bodyGrad)" stroke="#5d4037" stroke-width="3" stroke-linejoin="round" />
  
  <!-- La coquille en spirale -->
  <path d="M 64 8 C 85 30, 95 60, 90 90 C 80 115, 48 115, 38 90 C 33 60, 43 30, 64 8 Z" fill="url(#shellGrad)" stroke="#5d4037" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Lignes de la spirale (traits manga) -->
  <path d="M 52 30 Q 64 45 80 40" fill="none" stroke="#5d4037" stroke-width="4" stroke-linecap="round" />
  <path d="M 45 55 Q 64 70 88 62" fill="none" stroke="#5d4037" stroke-width="4" stroke-linecap="round" />
  <path d="M 40 80 Q 64 95 91 85" fill="none" stroke="#5d4037" stroke-width="4" stroke-linecap="round" />

  <!-- Reflets brillants typiques anime (Cel-shading) -->
  <path d="M 55 25 C 70 45, 78 65, 75 75" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  
  <!-- Tête Kawaii -->
  <!-- Oeil gauche -->
  <ellipse cx="48" cy="100" rx="3.5" ry="6" fill="#3e2723" />
  <circle cx="47" cy="97" r="1.5" fill="#ffffff" />
  
  <!-- Oeil droit -->
  <ellipse cx="66" cy="100" rx="3.5" ry="6" fill="#3e2723" />
  <circle cx="65" cy="97" r="1.5" fill="#ffffff" />
  
  <!-- Joues (Blush) -->
  <ellipse cx="40" cy="104" rx="4" ry="2" fill="#ff8a80" opacity="0.8" />
  <ellipse cx="74" cy="104" rx="4" ry="2" fill="#ff8a80" opacity="0.8" />
  
  <!-- Sourire -->
  <path d="M 54 105 Q 57 108 60 105" fill="none" stroke="#3e2723" stroke-width="2.5" stroke-linecap="round" />
</svg>