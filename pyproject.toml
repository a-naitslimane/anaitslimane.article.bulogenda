[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bulogenda"
version = "1.0.0"
description = "Application locale minimaliste de suivi de prospection, candidatures et opportunités."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
bulogenda = "backend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["db/*.sql"]